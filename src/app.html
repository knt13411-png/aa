<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사후검토 분석기</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<header id="appbar">
  <div class="brand">사후검토 분석기 <small>AAR · 오프라인</small></div>
  <span class="grow"></span>
  <button class="btn ghost" id="btnReport" hidden>PPT</button>
  <button class="btn primary" id="btnUpload">📂 엑셀 데이터 넣기</button>
</header>

<main>
<section id="home">
  <label id="drop" class="drop">
    <input type="file" id="fileXlsx" accept=".xlsx,.xls" multiple hidden>
    <div class="drop-icon">⬆</div>
    <div class="drop-title">훈련 데이터 엑셀을 넣으세요</div>
    <div class="drop-sub">여기를 눌러 파일을 고르거나 끌어 놓으면 바로 분석해서 결과를 보여 줍니다</div>
    <div class="drop-steps">
      <span>① 엑셀 데이터 넣기</span><span>→</span><span>② 자동 분석</span><span>→</span><span>③ 결과 화면 확인</span>
    </div>
  </label>
  <p class="hint center">여러 훈련 파일을 한 번에 넣으면 날짜순으로 정리하고, 가장 최근 훈련을 이전 훈련들과 비교합니다.</p>
  <p class="hint center"><a href="#" id="sampleLink">⬇ 입력 양식 샘플 받기 (.xlsx)</a> · 이 양식대로 채운 엑셀을 넣으면 됩니다</p>
  <div class="demo" id="demoBox">
    <b>🧪 샘플 데이터로 바로 체험하기</b>
    <button type="button" class="demo-btn" data-demo="0">샘플1 백두1호훈련 분석</button>
    <button type="button" class="demo-btn primary" data-demo="all">샘플 3개 한꺼번에 분석 (훈련 간 비교)</button>
    <div class="demo-dl">샘플 엑셀 받기: <a href="samples/%EC%83%98%ED%94%8C1_2026-06_%EB%B0%B1%EB%91%901%ED%98%B8%ED%9B%88%EB%A0%A8.xlsx" download>샘플1</a> · <a href="samples/%EC%83%98%ED%94%8C2_2026-08_%EB%B0%B1%EB%91%902%ED%98%B8%ED%9B%88%EB%A0%A8.xlsx" download>샘플2</a> · <a href="samples/%EC%83%98%ED%94%8C3_2026-10_%EB%B0%B1%EB%91%903%ED%98%B8%ED%9B%88%EB%A0%A8.xlsx" download>샘플3</a> · <a href="samples/%EC%82%AC%ED%9B%84%EA%B2%80%ED%86%A0_%EC%9E%85%EB%A0%A5%EC%96%91%EC%8B%9D_%EC%83%98%ED%94%8C.xlsx" download>입력 양식</a> · <a href="samples/%EC%83%98%ED%94%8C%EB%B8%8C%EB%A6%AC%ED%95%91_%EB%B0%B1%EB%91%903%ED%98%B8%ED%9B%88%EB%A0%A8_%EC%82%AC%ED%9B%84%EA%B2%80%ED%86%A0%EA%B2%B0%EA%B3%BC.pptx" download>결과 예시 PPT</a> <span class="hint">(모두 가상 데이터)</span></div>
  </div>
  <div id="histBox"></div>
</section>

<section id="dash" hidden></section>
</main>

<div id="dropCover" hidden><div>여기에 놓으면 새로 분석합니다</div></div>
<div id="busy" hidden><div class="spinner"></div><span>처리 중…</span></div>
<div id="toasts"></div>

<script>
//__LIBS__
</script>
<script>
//__APP__
</script>
</body>
</html>
