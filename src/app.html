<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사후검토 분석기</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<header id="appbar">
  <div class="brand">사후검토 분석기 <small>AAR · 오프라인</small></div>
  <span class="grow"></span>
  <button class="btn ghost" id="btnReport" hidden>PPT</button>
  <button class="btn primary" id="btnUpload">📂 엑셀 데이터 넣기</button>
</header>

<main>
<section id="home">
  <label id="drop" class="drop">
    <input type="file" id="fileXlsx" accept=".xlsx,.xls" multiple hidden>
    <div class="drop-icon">⬆</div>
    <div class="drop-title">훈련 데이터 엑셀을 넣으세요</div>
    <div class="drop-sub">여기를 눌러 파일을 고르거나 끌어 놓으면 바로 분석해서 결과를 보여 줍니다</div>
    <div class="drop-steps">
      <span>① 엑셀 데이터 넣기</span><span>→</span><span>② 자동 분석</span><span>→</span><span>③ 결과 화면 확인</span>
    </div>
  </label>
  <p class="hint center">여러 훈련 파일을 한 번에 넣으면 날짜순으로 정리하고, 가장 최근 훈련을 이전 훈련들과 비교합니다.</p>
  <p class="hint center"><a href="#" id="sampleLink">⬇ 입력 양식 샘플 받기 (.xlsx)</a> · 이 양식대로 채운 엑셀을 넣으면 됩니다</p>
  <div id="histBox"></div>
</section>

<section id="dash" hidden></section>
</main>

<div id="dropCover" hidden><div>여기에 놓으면 새로 분석합니다</div></div>
<div id="busy" hidden><div class="spinner"></div><span>처리 중…</span></div>
<div id="toasts"></div>

<script>
//__LIBS__
</script>
<script>
//__APP__
</script>
</body>
</html>
