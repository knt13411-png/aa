<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사후검토 분석기</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<header id="appbar">
  <div class="brand">사후검토 분석기 <small>AAR · 오프라인</small></div>
  <span class="grow"></span>
  <div id="barActs" hidden>
    <button class="btn ghost" id="btnNew">다른 파일 분석</button>
    <button class="btn primary" id="btnReport">⬇ 브리핑 자료 다운로드 (.pptx)</button>
  </div>
</header>

<main>
<section id="home">
  <label id="drop" class="drop">
    <input type="file" id="fileXlsx" accept=".xlsx,.xls" multiple hidden>
    <div class="drop-icon">⬆</div>
    <div class="drop-title">훈련 데이터 엑셀을 여기에 끌어 놓으세요</div>
    <div class="drop-sub">또는 눌러서 파일 선택 · 훈련명과 기간은 파일에서 자동으로 읽습니다</div>
    <div class="drop-steps">
      <span>① 파일 넣기</span><span>→</span><span>② 자동 분석·시각화</span><span>→</span><span>③ 브리핑 PPT(.pptx) 다운로드</span>
    </div>
  </label>
  <p class="hint center">여러 훈련 파일을 한 번에 넣으면 날짜순으로 정리하고, 가장 최근 훈련을 이전 훈련들과 비교합니다.</p>
  <div id="histBox"></div>
</section>

<section id="dash" hidden></section>
</main>

<div id="dropCover" hidden><div>여기에 놓으면 새로 분석합니다</div></div>
<div id="busy" hidden><div class="spinner"></div><span>처리 중…</span></div>
<div id="toasts"></div>

<script>
//__LIBS__
</script>
<script>
//__APP__
</script>
</body>
</html>
